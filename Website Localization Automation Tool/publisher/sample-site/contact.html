<!DOCTYPE html>

  <meta name="description" content="Contact AcmeCorp sales. We'd love to hear from you.">
  <title>AcmeCorp - Contact Us</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; margin:0; padding:0; line-height:1.6; color:#222; }
    header { background:#1e2937; color:#fff; padding:16px 32px; }
    header .logo { font-weight:900; font-size:20px; }
    nav { display:flex; gap:16px; }
    nav a { color:#fff; text-decoration:none; font-size:15px; }
    .container { max-width:960px; margin:0 auto; padding:32px; }
    form { display:grid; gap:16px; }
    input, textarea { padding:10px; border:1px solid #cbd5e1; border-radius:6px; }
    .btn { background:#2563eb; color:#fff; border:0; padding:12px 24px; border-radius:6px; font-size:16px; cursor:pointer; }
    footer { background:#111827; color:#9ca3ag; padding:24px 32px; text-align:center; font-size:14px; }
  </style>
</head>
<body>
  <header>
    <nav>
      <span class="logo">AcmeCorp</span>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="pricing.html">Pricing</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>
  <main class="container">
    <h1>Contact Us</h1>
    <p>Have a question? Contact our team. We'd love to hear from you.</p>
    <form id="contact-form">
      <input type="text" name="name" placeholder="Your name">
      <input type="email" name="email" placeholder="Your email">
      <textarea name="message" placeholder="Your message"></textarea>
      <button class="btn">Send Message</button>
    </form>
    <p>Email: hello@acmecorp.com</p>
    <p>Phone: +1 555 0100</p>
  </main>
