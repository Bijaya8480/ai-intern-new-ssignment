server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API and runtime endpoints to the backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    location /loc.js {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    location /runtime/ {
        proxy_pass http://backend:8000/api/runtime/;
        proxy_set_header Host $host;
    }
    location /sample-site/ {
        proxy_pass http://backend:8000/sample-site/;
        proxy_set_header Host $host;
    }
}
